<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leer en 3D — Amorosos Amaneceres</title>
    <meta
      name="description"
      content="Lee Amorosos Amaneceres como un libro 3D: pasa las páginas con el scroll."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌅</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/book3d.css" />
  </head>
  <body class="reader-body">
    <div class="reader-topbar">
      <a href="/index.html" id="readerHome" class="back-link"
        >← Inicio / Home</a
      >
      <div class="lang-dropdown" id="readerLangDropdown">
        <button
          type="button"
          class="lang-dropdown-toggle"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <span class="lang-current">ES</span><span class="lang-caret">▾</span>
        </button>
        <ul class="lang-dropdown-menu">
          <li><a href="#" id="readerLangEs" lang="es">Español</a></li>
          <li><a href="#" id="readerLangEn" lang="en">English</a></li>
        </ul>
      </div>
    </div>

    <div class="reader-scroll-track" id="scrollTrack">
      <div class="reader-viewport" id="readerViewport">
        <div id="webgl-container"></div>
        <div id="css3d-container"></div>
        <p class="reader-hint">Scroll ↓ / Desliza ↓</p>
      </div>
    </div>

    <div class="reader-jump-row" id="jumpRow"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script type="module" src="js/read.js"></script>
  </body>
</html>
